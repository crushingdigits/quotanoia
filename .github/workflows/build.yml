name: Build & Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug :wear:lintDebug

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Verify screenshot tests
        id: screenshotsverify
        continue-on-error: true
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Record screenshots if verification failed
        if: steps.screenshotsverify.outcome == 'failure' && github.event_name == 'pull_request'
        run: ./gradlew :app:recordRoborazziDebug

      - name: Push new screenshots if available
        if: steps.screenshotsverify.outcome == 'failure' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: '**/*.png'
          commit_message: 'Update screenshot baselines'

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease :wear:assembleRelease

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*
            **/build/reports/detekt/
            **/build/outputs/roborazzi/
