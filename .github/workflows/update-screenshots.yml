name: Update Screenshot Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update baselines on'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          lfs: true

      - uses: ./.github/actions/setup-build-env

      - name: Record screenshot baselines
        run: ./gradlew :app:recordRoborazziDebug

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.png'
          git diff --staged --quiet || git commit -m "Update screenshot baselines"
          git push
