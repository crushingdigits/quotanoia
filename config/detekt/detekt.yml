# Detekt overrides for Quotanoia (Compose-heavy Android project)
# All defaults inherited via buildUponDefaultConfig = true.
# Only deviations from defaults listed here.

style:
  MagicNumber:
    active: false                # Compose UI: dimensions, colors, weights everywhere
  ForbiddenComment:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'  # Allow PascalCase for @Composable
  MatchingDeclarationName:
    active: false                # Compose files have multiple top-level composables
